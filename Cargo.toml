[package]
name = "gafpack"
version = "0.1.2"
edition = "2021"
authors = ["Erik Garrison <erik.garrison@gmail.com>", "Andrea Guarracino <aguarra1@uthsc.edu>"]

[lib]
name = "gafpack"
path = "src/lib.rs"

[[bin]]
name = "gafpack"
path = "src/main.rs"

[features]
default = []
metis = ["dep:metis"]
gurobi = ["good_lp/lp-solvers"]

[dependencies]
metis = { version = "0.2", features = ["vendored"], optional = true }
clap = { version = "4.5", features = ["derive"] }
niffler = "3.0"
flate2 = "1.1"

# Copy number calling
statrs = "0.18"                                       # Negative binomial distribution
good_lp = { version = "1.14", default-features = false, features = ["highs"] }  # ILP solver (MIT, free)
log = "0.4"                                           # Logging facade
env_logger = "0.11"                                   # Logger implementation
