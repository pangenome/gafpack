[package]
name = "gafpack"
version = "0.1.2"
edition = "2021"
authors = ["Erik Garrison <erik.garrison@gmail.com>", "Andrea Guarracino <aguarra1@uthsc.edu>"]

[lib]
name = "gafpack"
path = "src/lib.rs"

[[bin]]
name = "gafpack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
niffler = "3.0.0"
flate2 = "1.1.3"
